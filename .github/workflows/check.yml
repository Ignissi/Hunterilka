name: Проверка
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hunterilka
          POSTGRES_PASSWORD: hunterilka
          POSTGRES_DB: hunterilka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUNTERILKA_TEST_DB: postgresql://hunterilka:hunterilka@localhost:5432/hunterilka_test
      HUNTERILKA_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check file boundaries, case thresholds and graph paths
        run: python -m tests.coursework coursework-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: coursework-results
          path: coursework-results.json
      - run: python -m compileall -q src scripts tests app.py
  coursework-windows:
    name: Coursework cases on Windows 11
    runs-on: windows-11-arm
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python -m tests.coursework coursework-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: coursework-results-windows
          path: coursework-results.json
