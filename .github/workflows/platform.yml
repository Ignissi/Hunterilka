name: Приёмка на целевых ОС
on:
  push:
    branches: [qa/trps-platforms-20261124]
permissions:
  contents: read
jobs:
  platform:
    name: ${{ matrix.os }} — приём минуты и браузер
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      HUNTERILKA_TEST_DB: postgresql://postgres:local_ci@127.0.0.1:5432/hunter_test
      HUNTERILKA_BENCH_DB: postgresql://postgres:local_ci@127.0.0.1:5432/hunter_bench
      HUNTERILKA_DB: postgresql://postgres:local_ci@127.0.0.1:5432/hunter_demo
      HUNTERILKA_REQUIRE_DB: '1'
      PGPASSWORD: local_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: PostgreSQL 16 on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/pg_ctl; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-16
          fi
          sudo service postgresql start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'local_ci'"
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: PostgreSQL 16 on Windows 11
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture,TotalVisibleMemorySize | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
          $root = Join-Path $env:RUNNER_TEMP 'pg16'
          curl.exe -fsSL --retry 3 'https://get.enterprisedb.com/postgresql/postgresql-16.10-1-windows-x64-binaries.zip' -o "$root.zip"
          if ($LASTEXITCODE) { throw 'PostgreSQL download' }
          Expand-Archive -Path "$root.zip" -DestinationPath $root
          $bin = Join-Path $root 'pgsql/bin'
          $data = Join-Path $env:RUNNER_TEMP 'hunterpgdata'
          & "$bin/initdb.exe" -D $data -U postgres -A trust -E UTF8 --locale=C
          if ($LASTEXITCODE) { throw 'initdb' }
          & "$bin/pg_ctl.exe" -D $data -l "$env:RUNNER_TEMP/pg.log" -o '-p 5432 -h 127.0.0.1' -w start
          if ($LASTEXITCODE) { throw 'pg_ctl' }
          $bin >> $env:GITHUB_PATH
      - name: Install dependencies and browser
        run: |
          python -m pip install -r requirements.txt playwright==1.55.0 psutil==6.1.1
          python -m playwright install chromium
      - name: Load release models and PostgreSQL example
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.2-local-20261111 --pattern hunterilka-v2.2-windows-20261111_080916.zip --output release-test.zip
          python -m scripts.acceptance_platform prepare
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Measure five inputs and open five saved cases in a browser
        run: python -m scripts.acceptance_platform run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-${{ matrix.os }}
          path: |
            platform-result.json
            platform-streamlit.log
          if-no-files-found: ignore
