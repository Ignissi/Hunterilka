<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" role="img" aria-labelledby="title desc">
<title id="title">Схема 1. Архитектура Hunterилка</title>
<desc id="desc">Подготовленные события поступают полными временными группами. CatBoost оценивает операции по прошлому состоянию графа. После добавления группы независимый поиск выделяет структуры для Isolation Forest. Оба канала передают отдельные сигналы в сохранённый случай и рабочее место специалиста.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66778b"/></marker></defs>
<rect width="1240" height="1060" fill="#f4f6fa" rx="20"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#18283d}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#55657a}.h{font-size:20px;font-weight:700}.body{font-size:16px}.kicker{font-size:15px;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#66778b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="40" y="53" class="title">Hunterилка  /  архитектура системы</text>
<text x="40" y="83" class="sub">Схема 1 · два уровня анализа, общий временной контракт, сохранённый результат</text>
<rect x="40" y="110" width="1160" height="110" rx="12" fill="#172a44" stroke="#172a44"/>
<text x="64" y="143" class="kicker" style="fill:#a8c8f4">ВХОД И ПОДГОТОВКА</text>
<text x="64" y="174" class="h" style="fill:#ffffff">IBM AML CSV → проверка и сортировка → события Parquet → группы времени t</text>
<text x="64" y="201" class="body" style="fill:#d0dbea">Метки хранятся отдельно. Они используются только при обучении и оценке качества.</text>
<path d="M 210 220 V 235 H 20 V 340 H 35" class="line"/>
<text x="40" y="261" class="kicker" style="fill:#235fab">01  ОЦЕНКА ОПЕРАЦИЙ ПО ПРОШЛОМУ</text>
<rect x="40" y="280" width="350" height="120" rx="12" fill="#eaf1fc" stroke="#dbe2eb"/>
<text x="60" y="312" class="h">Состояние графа S(t−)</text>
<text x="60" y="341" class="body">Истечение старых событий</text>
<text x="60" y="365" class="body">История счетов и связей</text>
<text x="60" y="389" class="body">Окна 1 ч, 24 ч и 30 дней</text>
<path d="M 390 340 H 430" class="line"/>
<rect x="440" y="280" width="350" height="120" rx="12" fill="#fff" stroke="#dbe2eb"/>
<text x="460" y="312" class="h">Признаки операции</text>
<text x="460" y="341" class="body">Поля нового перевода</text>
<text x="460" y="365" class="body">Прошлые агрегаты и топология</text>
<text x="460" y="389" class="body">Один контекст для всей группы</text>
<path d="M 790 340 H 830" class="line"/>
<rect x="840" y="280" width="360" height="120" rx="12" fill="#eaf1fc" stroke="#dbe2eb"/>
<text x="860" y="312" class="h">CatBoost</text>
<text x="860" y="341" class="body">Оценка каждой операции</text>
<text x="860" y="365" class="body">Сохранённый вектор признаков</text>
<text x="860" y="389" class="body">SHAP по запросу</text>
<path d="M 1020 400 V 430 H 20 V 540 H 35" class="line"/>
<text x="500" y="420" class="sub">После оценки всей группы</text>
<text x="40" y="463" class="kicker" style="fill:#0f7465">02  НЕЗАВИСИМЫЙ АНАЛИЗ СТРУКТУР</text>
<rect x="40" y="480" width="350" height="120" rx="12" fill="#e7f5f0" stroke="#dbe2eb"/>
<text x="60" y="512" class="h">Обновление графа S(t)</text>
<text x="60" y="541" class="body">Добавление целой группы</text>
<text x="60" y="565" class="body">События, индексы и связи</text>
<text x="60" y="589" class="body">Порядок задаёт pipeline.py</text>
<path d="M 390 540 H 430" class="line"/>
<rect x="440" y="480" width="350" height="120" rx="12" fill="#fff" stroke="#dbe2eb"/>
<text x="460" y="512" class="h">Поиск кандидатов</text>
<text x="460" y="541" class="body">Цепочки, кольца, звёзды</text>
<text x="460" y="565" class="body">Обход от каждой операции</text>
<text x="460" y="589" class="body">Без фильтра по CatBoost</text>
<path d="M 790 540 H 830" class="line"/>
<rect x="840" y="480" width="360" height="120" rx="12" fill="#e7f5f0" stroke="#dbe2eb"/>
<text x="860" y="512" class="h">Isolation Forest</text>
<text x="860" y="541" class="body">Признаки найденной структуры</text>
<text x="860" y="565" class="body">Необычность сочетания</text>
<text x="860" y="589" class="body">Без меток и баллов CatBoost</text>
<path d="M 1200 340 H 1220 V 730 H 1195" class="line"/>
<path d="M 1020 600 V 680" class="line"/>
<text x="40" y="653" class="kicker" style="fill:#754a9a">03  СЛУЧАЙ КАК ЕДИНИЦА РАССМОТРЕНИЯ</text>
<rect x="40" y="685" width="1160" height="125" rx="12" fill="#f1ecf7" stroke="#dbe2eb"/>
<text x="64" y="719" class="h">CaseService · снимок основания и версии</text>
<text x="64" y="752" class="body">Сигнал операции / сигнал структуры / оба сигнала. Оценки сохраняются раздельно.</text>
<text x="64" y="783" class="body">JSON: детали и решения. Parquet: индекс. Случай сохраняется после изменения рабочего графа.</text>
<path d="M 620 810 V 858" class="line"/>
<text x="40" y="847" class="kicker" style="fill:#235fab">04  РАБОЧЕЕ МЕСТО СПЕЦИАЛИСТА</text>
<rect x="40" y="865" width="1160" height="112" rx="12" fill="#fff" stroke="#dbe2eb"/>
<text x="64" y="899" class="h">Очереди операций и структур → граф случая → объяснение → решение</text>
<text x="64" y="932" class="body">Streamlit + PyVis · до 40 счетов / 80 связей, расширение до 100 / 200</text>
<text x="64" y="958" class="sub">Полный активный граф остаётся в вычислительном контуре. В браузере только выбранный случай.</text>
<text x="40" y="1012" class="body">Обучение отдельно: признаки → train / validation → модели и контракты → оценка на test</text>
<text x="40" y="1040" class="sub">Воспроизведение: группы событий, пауза, контрольная точка и восстановление повторным проходом.</text>
</svg>
